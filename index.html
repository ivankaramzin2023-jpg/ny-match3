<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#7bb5e8">
    <title>Новогодняя Игра — Три в ряд (LB Bonus)</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        (function() {
            function updateAppHeight() {
                var h = window.innerHeight;
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.viewportHeight) {
                    h = window.Telegram.WebApp.viewportHeight;
                }
                document.documentElement.style.setProperty('--app-height', h + 'px');
            }
            updateAppHeight();
            window.addEventListener('resize', updateAppHeight);
            window.addEventListener('orientationchange', updateAppHeight);
        })();
    </script>
    <link rel="stylesheet" href="style.css?v=3.0.1">
    <!-- Non-blocking Google Fonts loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Oranienbaum&family=Rubik:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,900&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Oranienbaum&family=Rubik:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,900&display=swap">
    </noscript>

    <!-- Preload Rules & Buttons for zero-flicker transitions -->
    <link rel="preload" as="image" href="assets/header_cover.png?v=3.0.0">
    <link rel="preload" as="image" href="assets/header_rules.png?v=3.0.0">
    <link rel="preload" as="image" href="assets/header_result.png?v=3.0.0">
    <link rel="preload" as="image" href="assets/header_final.png?v=3.0.0">
    <link rel="preload" as="image" href="assets/cover_title_v2.png?v=3.0.0">
    <link rel="preload" as="image" href="assets/cover_subtitle_v2.png?v=3.0.0">
    <link rel="preload" as="image" href="assets/rules_card_1.webp">
    <link rel="preload" as="image" href="assets/rules_card_2.webp">
    <link rel="preload" as="image" href="assets/rules_card_3.webp">
    <link rel="preload" as="image" href="assets/btn_next.svg">
    <link rel="preload" as="image" href="assets/btn_skip.svg">
    <link rel="preload" as="image" href="assets/rules_btn_start.webp">
    <link rel="preload" as="image" href="assets/timer_pill_bg.webp">
    <link rel="preload" as="image" href="assets/coin_lb.webp">
    <link rel="preload" as="image" href="assets/result_plate_card.webp">
    <link rel="preload" as="image" href="assets/result_coin.webp">
    <link rel="preload" as="image" href="assets/result_btn_claim.webp">
    <link rel="preload" as="image" href="assets/result_btn_retry.webp">
</head>
<body>
    <div id="gameContainer">
        <!-- Universal Backgrounds (Single static winter sky for Cover & Rules, Zero Flicker) -->
        <img id="bgSky" src="assets/01_cover_bg.webp" class="figma-bg-sky" alt="Фон неба">
        <img id="bgGame" src="assets/bg_game.webp" class="figma-bg-sky figma-bg-game" alt="Фон игры">

        <!-- Dynamic Falling Snowflakes Canvas (Rendered behind gameplay tiles, above background) -->
        <canvas id="snowCanvas"></canvas>

        <!-- Main Game Canvas (Match-3 Grid, Tiles, Dishes, Glows, Particles) -->
        <canvas id="gameCanvas" class="hidden"></canvas>

        <!-- Gameplay Top HUD -->
        <div id="hud" class="hidden">
            <!-- Row 1: Santa Progress Track + LB Coin + 4-digit Score (0000) -->
            <div class="hud-score-progress-row">
                <div class="hud-progress-track-wrap">
                    <div class="hud-progress-track">
                        <div id="progressFill" class="hud-progress-fill"></div>
                        <img id="progressSanta" src="assets/progress_santa.webp" class="hud-progress-santa" alt="Дед Мороз">
                    </div>
                </div>
                <div class="hud-coin-score-group">
                    <img src="assets/coin_lb.webp" class="hud-score-coin" alt="LB">
                    <span id="scoreDigits" class="hud-score-digits">0000</span>
                </div>
            </div>

            <!-- Row 2: Centered Timer in light-blue pill -->
            <div class="hud-timer-row">
                <div id="timerChip" class="hud-timer-pill">
                    <img src="assets/timer_pill_bg.webp?v=1.9.4" class="hud-timer-pill-bg" alt="">
                    <span class="hud-timer-content">
                        <span class="timer-icon">⏱</span>
                        <span id="timerText">60с</span>
                    </span>
                </div>
                <div id="comboBanner" class="hud-combo-banner hidden">КОМБО x1.5!</div>
            </div>
        </div>

        <!-- SCREEN 1: Cover Screen -->
        <div id="startScreen" class="cover-elements-container">
            <div class="cover-top-box">
                <img src="assets/header_cover.png?v=3.0.0" class="cover-ribbon-banner" alt="Новогодняя Игра">
            </div>
            <div class="cover-santa-wrapper">
                <img src="assets/cover_santa_match3.webp" class="cover-santa" alt="Дед Мороз собирает сет">
            </div>
            <div class="cover-bottom-plate-box">
                <img src="assets/cover_plate.webp" class="cover-plate-bg" alt="Снежная плашка">
                <div class="cover-plate-content">
                    <div class="cover-text-group">
                        <img src="assets/cover_title_v2.png?v=3.0.0" class="cover-title-img" alt="Выигрывайте до 1000 БОНУСОВ!">
                        <img src="assets/cover_subtitle_v2.png?v=3.0.0" class="cover-subtitle-img" alt="Собирайте новогодние сеты и получите шанс пополнить карту LB Бонус">
                    </div>
                    <button id="playBtn" class="cover-play-btn-graphic" type="button" aria-label="ИГРАТЬ">
                        <img src="assets/btn_play.webp?v=1.9.6" class="cover-play-btn-img" alt="ИГРАТЬ">
                    </button>
                </div>
            </div>
        </div>

        <!-- SCREEN 2: Rules Slider Screen -->
        <div id="rulesScreen" class="rules-screen-container hidden">
            <div class="rules-top-box">
                <img src="assets/header_rules.png?v=3.0.0" class="rules-ribbon-banner" alt="Новогодний сет">
            </div>

            <!-- 2. Middle Zone: Rules Card Slot + Pagination Dots (strictly 14px apart) -->
            <div class="rules-card-container">
                <div id="rulesCardSlot" class="rules-card-slot">
                    <img src="assets/rules_card_1.webp" class="rules-card-img" alt="Правило 1: Меняйте блюда местами">
                </div>

                <!-- 3. Pagination Dots (shows active rule: 3 rules) -->
                <div id="rulesPagination" class="rules-pagination">
                    <span class="pagination-dot active" data-index="0"></span>
                    <span class="pagination-dot" data-index="1"></span>
                    <span class="pagination-dot" data-index="2"></span>
                </div>
            </div>

            <!-- 4. Bottom Zone: Dual buttons (Далее / Пропустить) or Single (Старт) -->
            <div id="rulesBottomBox" class="rules-bottom-box">
                <div id="dualButtonsGroup" class="rules-buttons-group">
                    <button id="rulesNextBtn" class="rules-svg-btn rules-btn-next" type="button" aria-label="Далее">
                        <img src="assets/btn_next.svg" class="rules-btn-img" alt="Далее">
                    </button>
                    <button id="rulesSkipBtn" class="rules-svg-btn rules-btn-skip" type="button" aria-label="Пропустить">
                        <img src="assets/btn_skip.svg" class="rules-btn-img" alt="Пропустить">
                    </button>
                </div>
                <div id="singleStartGroup" class="rules-buttons-group hidden">
                    <button id="rulesStartBtn" class="rules-svg-btn rules-btn-start" type="button" aria-label="Старт">
                        <img src="assets/rules_btn_start.webp" class="rules-btn-img rules-btn-img-start" alt="Старт">
                    </button>
                </div>
            </div>
        </div>

        <!-- SCREEN 3: Countdown (3..2..1) -->
        <div id="countdownOverlay" class="screen-overlay hidden">
            <div class="countdown-card">
                <img id="cnt3" class="countdown-number" src="assets/count_3.webp" alt="3">
                <img id="cnt2" class="countdown-number" src="assets/count_2.webp" alt="2">
                <img id="cnt1" class="countdown-number" src="assets/count_1.webp" alt="1">
            </div>
        </div>

        <!-- Toast Notification (Shuffle / Hint) -->
        <div id="gameToast" class="game-toast hidden">Поле перемешано!</div>

        <!-- SCREEN 4: Результаты игры -->
        <div id="resultScreen" class="result-screen-container hidden">
            <!-- Верхняя лента "УРОВЕНЬ: ЛЕГЕНДА" -->
            <div class="result-top-box">
                <img src="assets/header_result.png?v=3.0.0" class="result-ribbon-banner" alt="Уровень: Легенда">
            </div>

            <!-- Центральная плашка с блюдами и динамическими баллами -->
            <div class="result-card-container">
                <div class="result-card-box">
                    <img src="assets/result_plate_card.webp" class="result-plate-bg" alt="Вы заработали">
                    <div class="result-card-content">
                        <!-- Динамические баллы "+300" и монетка LB -->
                        <div class="result-score-row">
                            <span id="resultScoreValue" class="result-score-text">+0</span>
                            <img src="assets/result_coin.webp" class="result-coin-icon" alt="LB Монета">
                        </div>
                        <!-- Текстовый блок попыток и лучшего результата -->
                        <div class="result-stats-block">
                            <div id="resultAttemptsText" class="result-stat-line">Осталось попыток: 3/3</div>
                            <div id="resultBestScoreText" class="result-stat-line">Ваш лучший результат: 0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Нижний блок кнопок: Забрать бонусы + Попробовать еще раз -->
            <div class="result-bottom-box">
                <button id="btnClaimBonus" class="result-action-btn" type="button" aria-label="Забрать бонусы">
                    <img src="assets/result_btn_claim.webp" class="result-btn-img" alt="Забрать бонусы">
                </button>
                <button id="btnRetryGame" class="result-action-btn" type="button" aria-label="Попробовать еще раз">
                    <img src="assets/result_btn_retry.webp" class="result-btn-img" alt="Попробовать еще раз">
                </button>
            </div>
        </div>

        <!-- SCREEN 5: Финальный экран выхода и программы лояльности -->
        <div id="exitScreen" class="exit-screen-container hidden">
            <!-- Верхняя праздничная лента "СПАСИБО ЗА ВИЗИТ!" -->
            <div class="exit-ribbon-wrapper">
                <img src="assets/header_final.png?v=3.0.0" class="exit-ribbon-banner" alt="Спасибо за визит!">
            </div>

            <!-- Дед Мороз с подносом новогодних блюд и сиянием сзади -->
            <div class="exit-santa-wrapper">
                <div class="santa-glow-circle"></div>
                <img src="assets/exit_santa.webp" class="exit-santa-img" alt="Дед Мороз с подносом блюд">
            </div>

            <!-- Ледяная плашка лояльности 1:1 по макету -->
            <div class="exit-card-box">
                <img src="assets/exit_card_clean.webp" class="exit-card-bg" alt="Ледяная плашка">
                <div class="exit-card-content">
                    <div class="exit-text-group">
                        <h2 class="exit-heading">Бонусы уже на карте<br>лояльности!<br>Ждем вас снова!</h2>
                        <p class="exit-subheading">Играйте и получайте бонусы. Каждый визит в ресторан открывает следующую игру</p>
                        <p class="exit-footnote">Списывайте до 20% от стоимости заказа в любом проекте LB Бонус до 31.01</p>
                    </div>
                    <button id="btnExitGame" class="exit-btn-quit" type="button" aria-label="ВЫЙТИ">
                        <img src="assets/exit_btn_quit.webp" class="exit-btn-quit-img" alt="ВЫЙТИ">
                    </button>
                </div>
            </div>
        </div>

        <!-- Confetti Celebration Canvas (Rendered above Results Screen) -->
        <canvas id="confettiCanvas" class="screen-confetti-canvas"></canvas>
    </div>

    <!-- Game Engine -->
    <script src="game.js?v=3.0.0"></script>
</body>
</html>
